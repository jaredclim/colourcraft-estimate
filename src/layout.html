    'phone_conversion_number': '778-828-3967',
    'phone_conversion_css_class': 'ccp-phone-swap',
    // Click-to-call: the css_class swaps displayed text only, so rewrite the
    // tel: href too or mobile taps dial the untracked number.
    'phone_conversion_callback': function(formatted_number, mobile_number) {
      document.querySelectorAll('a[href^="tel:"]').forEach(function(a){
        a.href = 'tel:' + mobile_number.replace(/[^0-9+]/g,'');
      });
    }
  });
</script>
