<script>
  (function(){
    var params = new URLSearchParams(location.search);
    var keep = [];
    params.forEach(function(v,k){
      if (/^(gclid|gbraid|wbraid|utm_\w+)$/i.test(k)) keep.push(k + '=' + encodeURIComponent(v));
    });
    if (keep.length) {
      document.querySelectorAll('a.dj-link').forEach(function(a){ a.href = a.href + '&' + keep.join('&'); });
    }
    var geo = (params.get('geo') || '').toLowerCase().replace(/[^a-z]/g, '');
    var geoNames = {ladner:'Ladner.', tsawwassen:'Tsawwassen.', steveston:'Steveston.', richmond:'Richmond.', delta:'Delta.', northdelta:'North Delta.'};
    if (geoNames[geo]) {
      var line = document.getElementById('geo-line');
      if (line) line.textContent = geoNames[geo];
      document.title = 'House Painters in ' + geoNames[geo].replace(/\.$/, '') + ', BC | Colour Craft Painting';
    }
    if (geo === 'delta' || geo === 'ladner' || geo === 'tsawwassen') {
      var workGrid = document.querySelector('#work .grid3');
      var deltaCard = workGrid && workGrid.querySelector('[data-city="delta"]');
      if (workGrid && deltaCard) workGrid.insertBefore(deltaCard, workGrid.firstElementChild);
    }
    document.querySelectorAll('a.dj-link').forEach(function(a){
      a.addEventListener('click', function(){ if (typeof gtag === 'function') gtag('event', 'book_cta_click'); });
    });
    // Mobile menu
    var tog=document.querySelector('.nav-toggle'), mnav=document.querySelector('.mobile-nav');
    if(tog&&mnav){tog.addEventListener('click',function(){
      var open=!mnav.hasAttribute('hidden');
      if(open){mnav.setAttribute('hidden','');tog.setAttribute('aria-expanded','false');}
      else{mnav.removeAttribute('hidden');tog.setAttribute('aria-expanded','true');}
    });}
    // Services dropdown: keyboard/tap support alongside the hover rule
    var trig=document.querySelector('.nav-trigger');
    if(trig){trig.addEventListener('click',function(){
      var d=trig.closest('.nav-drop');
      var shown=d.classList.toggle('open');
      trig.setAttribute('aria-expanded',shown?'true':'false');
    });}
  })();
</script>

<script>
  (function(){
    window.tidyRows = function(){
      var grid = document.getElementById('live-grid');
      if (!grid) return;
      var cards = [].slice.call(grid.querySelectorAll('.revd'));
      cards.forEach(function(c){ c.style.display = ''; });
      var tracks = getComputedStyle(grid).gridTemplateColumns || '';
      var cols = tracks.split(' ').filter(function(x){ return x && x !== 'none'; }).length || 1;
      var extra = cards.length % cols;
      if (extra) cards.slice(cards.length - extra).forEach(function(c){ c.style.display = 'none'; });
    };
    window.addEventListener('resize', function(){ window.tidyRows(); });
    document.addEventListener('DOMContentLoaded', function(){ window.tidyRows(); });
  })();
  // Live rating / count / newest reviews, mirrored from the main site's
  // GBP-synced feed via our same-origin /api/reviews proxy. Static values
  // in the markup are the fallback when the fetch fails (file://, outage).
  (function(){
    fetch('/api/reviews').then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
      if (!d || !d.rating || !d.totalReviews) return;
      document.querySelectorAll('[data-live="rating"]').forEach(function(el){ el.textContent = d.rating; });
      document.querySelectorAll('[data-live="count"]').forEach(function(el){ el.textContent = d.totalReviews; });
      var syncedEl = document.querySelector('[data-live="synced"]');
      if (syncedEl && d.lastSyncedAt) {
        var days = Math.floor((Date.now() - new Date(d.lastSyncedAt).getTime()) / 86400000);
        syncedEl.textContent = days <= 0 ? 'Updated today' : days === 1 ? 'Updated yesterday' : 'Updated ' + days + ' days ago';
      }
      var grid = document.getElementById('live-grid');
      if (!grid || !d.reviews || !d.reviews.length) { tidyRows(); return; }
      d.reviews = d.reviews.filter(function(rv){ return rv.text && rv.text.trim().length >= 60; });
      if (!d.reviews.length) { tidyRows(); return; }
      var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
      var star = '<svg class="ic" width="14" height="14"><use href="#ic-star"/></svg>';
      var names = d.reviews.map(function(rv){ return (rv.authorName || '').trim().toLowerCase(); });
      grid.querySelectorAll('.revd b').forEach(function(b){
        if (names.indexOf(b.textContent.trim().toLowerCase()) !== -1) {
          var card = b.closest('.revd');
          if (card) card.parentNode.removeChild(card);
        }
      });
      var html = d.reviews.map(function(rv){
        var stars = new Array(Math.max(1, Math.min(5, rv.rating || 5)) + 1).join(star);
        var avatar = rv.authorPhoto
          ? '<img class="avatar-img" src="' + esc(rv.authorPhoto) + '" alt="" loading="lazy" referrerpolicy="no-referrer">'
          : '<span class="avatar" style="background:#6E5A3E">' + esc((rv.authorName || '?').charAt(0)) + '</span>';
        return '<div class="revd"><div class="revd-head">' + avatar + '<div><b>' + esc(rv.authorName) + '</b><span class="loc">Google review</span></div><svg class="ic gmark" width="18" height="18"><use href="#ic-google"/></svg></div><div class="stars-row">' + stars + '</div><p>"' + esc(rv.text) + '"</p></div>';
      }).join('');
      grid.insertAdjacentHTML('afterbegin', html);
      var note = document.getElementById('live-note');
      if (note) note.hidden = false;
      tidyRows();
    }).catch(function(){});
  })();
</script>

<script>
  // Per-geo project sets. Heading names the widest geography we can honestly
  // fill; cards lead with the nearest real project.
  (function(){
    var P = {
      raymond: ['raymond', 'Seafair &middot; Richmond', 'Stucco Exterior Repaint', 'Colour-matched full exterior'],
      amanda:  ['amanda',  'Tsawwassen &middot; Delta', 'Full Exterior Repaint', 'Full exterior repaint'],
      kathy:   ['kathy',   'Tsawwassen &middot; Delta', 'Full Exterior Repaint', 'Colour-matched full repaint'],
      andy:    ['andy',    'Tsawwassen &middot; Delta', 'Full Exterior Repaint', 'Full exterior repaint'],
      mumtaz:  ['mumtaz',  'Steveston &middot; Richmond', 'Full Exterior Repaint', 'Two-tone full exterior'],
      larry:   ['larry',   'Steveston &middot; Richmond', 'Log Home Re-Stain', 'Log siding re-stained'],
      markw:   ['markwong','Steveston &middot; Richmond', 'Exterior Trim Repaint', 'Colour-matched trim'],
      church:  ['church',  'Richmond', 'Interior Church Repaint', 'Interior walls and ceilings'],
      dick:    ['dick',    'Ladner &middot; Delta', 'Fascia &amp; Trim', 'Colour-matched fascia and trim'],
      denisse: ['denisse', 'North Delta', 'Fascia &amp; Shutters', 'Partial trim job'],
      diane:   ['diane',   'Tsawwassen &middot; Delta', 'Full Exterior Repaint', 'Colour-matched full repaint']
    };
    var SINGLE = { markw: 1, dick: 1, kelian: 1, monika: 1 };
    var SETS = {
      richmond:   { head: 'Our Work in Richmond',   set: ['raymond', 'mumtaz', 'church'] },
      steveston:  { head: 'Our Work in Steveston',  set: ['larry', 'mumtaz', 'markw'] },
      delta:      { head: 'Our Work in Delta',      set: ['amanda', 'kathy', 'andy'] },
      tsawwassen: { head: 'Our Work in Tsawwassen', set: ['amanda', 'kathy', 'andy'] },
      ladner:     { head: 'Our Work in Delta',      set: ['dick', 'amanda', 'andy'] },
      northdelta: { head: 'Our Work in Delta',      set: ['denisse', 'amanda', 'andy'] }
    };
    var geo = (new URLSearchParams(location.search).get('geo') || '').toLowerCase().replace(/[^a-z]/g, '');
    var cfg = SETS[geo];
    if (!cfg) return;
    var head = document.getElementById('work-head');
    if (head) head.innerHTML = cfg.head;
    cfg.set.forEach(function(key, i){
      var d = P[key], card = document.querySelector('.card[data-slot="' + i + '"]');
      if (!d || !card) return;
      var ba = card.querySelector('.ba'), b = ba.querySelector('[data-role="b"]'), a = ba.querySelector('[data-role="a"]');
      if (SINGLE[key]) {
        ba.classList.add('single');
        b.remove();
        ba.querySelector('.ba-chip.before') && ba.querySelector('.ba-chip.before').remove();
        ba.querySelector('.ba-chip.after') && ba.querySelector('.ba-chip.after').remove();
      } else {
        b.src = 'img/work/' + d[0] + '-b.webp';
        b.alt = d[2] + ' before, ' + d[1].replace('&middot;', '-');
      }
      a.src = 'img/work/' + d[0] + '-a.webp';
      a.alt = d[2] + ' after by Colour Craft Painting';
      card.querySelector('[data-role="tag"]').innerHTML = d[1];
      card.querySelector('[data-role="title"]').innerHTML = d[2];
      card.querySelector('[data-role="scope"]').innerHTML = d[3];
    });
  })();
</script>
